name: badminton_hawkeye
description: Professional Badminton Hawk-Eye Video Analyzer & HUD Overlay System for Android
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  video_player: ^2.8.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  http: ^1.2.0
  web_socket_channel: ^2.4.1
  shared_preferences: ^2.2.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/sample/
